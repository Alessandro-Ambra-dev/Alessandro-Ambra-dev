<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 60" role="img" aria-label="Disponibile per nuovi progetti">
  <rect x="10" y="10" width="500" height="40" rx="20" fill="#0d1117" stroke="#2E9EF7" stroke-width="1.5" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <circle cx="38" cy="30" r="8" fill="#22c55e">
    <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="38" cy="30" r="14" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="8;20;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="270" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    Disponibile per nuovi progetti
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
