<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="Alessandro Ambra - Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <path fill="url(#waveGrad)" opacity="0.6">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,160 C200,120 400,200 600,160 C800,120 1000,200 1200,160 L1200,220 L0,220 Z;
              M0,170 C200,210 400,130 600,170 C800,210 1000,130 1200,170 L1200,220 L0,220 Z;
              M0,160 C200,120 400,200 600,160 C800,120 1000,200 1200,160 L1200,220 L0,220 Z"/>
  </path>

  <path fill="#ffffff" opacity="0.08">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,180 C300,140 500,220 800,180 C950,160 1100,200 1200,185 L1200,220 L0,220 Z;
              M0,185 C300,225 500,145 800,185 C950,205 1100,165 1200,180 L1200,220 L0,220 Z;
              M0,180 C300,140 500,220 800,180 C950,160 1100,200 1200,185 L1200,220 L0,220 Z"/>
  </path>

  <text x="600" y="95" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff" filter="url(#glow)">
    Alessandro Ambra
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#e8f4ff" opacity="0.9">
    Full-Stack &amp; Mobile Developer
  </text>

  <rect x="0" y="0" width="1200" height="3" fill="#ffffff" opacity="0.25">
    <animate attributeName="y" values="-3;220;-3" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
