<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="Stack tecnologico: React, Next.js, TypeScript, Node.js, Python, AWS, React Native, SQL">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </radialGradient>
  </defs>

  <circle cx="350" cy="190" r="120" fill="none" stroke="#2E9EF7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 6">
    <animateTransform attributeName="transform" type="rotate" from="0 350 190" to="360 350 190" dur="30s" repeatCount="indefinite"/>
  </circle>

  <circle cx="350" cy="190" r="85" fill="none" stroke="#2E9EF7" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="360 350 190" to="0 350 190" dur="20s" repeatCount="indefinite"/>
  </circle>

  <circle cx="350" cy="190" r="55" fill="url(#coreGrad)">
    <animate attributeName="r" values="52;58;52" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="350" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Full-Stack</text>
  <text x="350" y="203" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#e8f4ff">Developer</text>

  <!-- React -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#61DAFB" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#61DAFB" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">React</tspan>
    </text>
  </g>

  <!-- Next.js -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#ffffff" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-1.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-1.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">Next.js</tspan>
    </text>
  </g>

  <!-- TypeScript -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#007ACC" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-3s" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#007ACC" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-3s" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">TS</tspan>
    </text>
  </g>

  <!-- Node.js -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#68A063" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-4.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#68A063" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-4.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">Node</tspan>
    </text>
  </g>

  <!-- Python -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#3776AB" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-6s" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#3776AB" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-6s" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">Python</tspan>
    </text>
  </g>

  <!-- AWS -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#FF9900" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-7.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#FF9900" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-7.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">AWS</tspan>
    </text>
  </g>

  <!-- React Native -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#13B9FD" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-9s" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#13B9FD" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-9s" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">RN</tspan>
    </text>
  </g>

  <!-- SQL -->
  <g>
    <circle r="28" fill="#1a2332" stroke="#3ECF8E" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-10.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#3ECF8E" text-anchor="middle">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-10.5s" path="M350,70 A120,120 0 1,1 349.9,70"/>
      <tspan dy="4">SQL</tspan>
    </text>
  </g>

  <!-- Inner orbit - Vue, Java -->
  <g>
    <circle r="22" fill="#1a2332" stroke="#4FC08D" stroke-width="1.5">
      <animateMotion dur="8s" repeatCount="indefinite" path="M350,105 A85,85 0 1,1 349.9,105"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#4FC08D" text-anchor="middle">
      <animateMotion dur="8s" repeatCount="indefinite" path="M350,105 A85,85 0 1,1 349.9,105"/>
      <tspan dy="3">Vue</tspan>
    </text>
  </g>

  <g>
    <circle r="22" fill="#1a2332" stroke="#ED8B00" stroke-width="1.5">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-4s" path="M350,105 A85,85 0 1,1 349.9,105"/>
    </circle>
    <text font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#ED8B00" text-anchor="middle">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-4s" path="M350,105 A85,85 0 1,1 349.9,105"/>
      <tspan dy="3">Java</tspan>
    </text>
  </g>
</svg>
