<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2E9EF7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="50" y1="12" x2="750" y2="12" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round"
    stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" values="700;0;700" dur="4s" repeatCount="indefinite"/>
  </line>

  <circle r="5" fill="#2E9EF7" cy="12">
    <animate attributeName="cx" values="50;750;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
